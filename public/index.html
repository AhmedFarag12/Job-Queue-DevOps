<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job System</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="toast" class="toast" hidden></div>

  <!-- Auth view -->
  <section id="authView" class="auth-view">
    <div class="auth-card">
      <h1>Job System</h1>
      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Sign in</button>
        <button class="tab-btn" data-tab="register">Register</button>
      </div>

      <form id="loginForm" class="tab-panel active">
        <label>Email
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label>Password
          <input type="password" name="password" required autocomplete="current-password" />
        </label>
        <button type="submit" class="btn primary">Sign in</button>
      </form>

      <form id="registerForm" class="tab-panel">
        <label>Email
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label>Password
          <input type="password" name="password" required minlength="8" autocomplete="new-password" />
          <small>At least 8 characters</small>
        </label>
        <button type="submit" class="btn primary">Create account</button>
      </form>
    </div>
  </section>

  <!-- Dashboard view -->
  <section id="dashboardView" class="dashboard-view" hidden>
    <header class="topbar">
      <h1>Job System</h1>
      <div class="topbar-right">
        <span id="userEmail" class="user-email"></span>
        <button id="logoutBtn" class="btn ghost">Log out</button>
      </div>
    </header>

    <main class="content">
      <div class="toolbar">
        <div class="toolbar-left">
          <select id="statusFilter">
            <option value="">All statuses</option>
            <option value="pending">Pending</option>
            <option value="active">Active</option>
            <option value="completed">Completed</option>
            <option value="failed">Failed</option>
          </select>
          <button id="refreshBtn" class="btn ghost">Refresh</button>
        </div>
        <button id="newJobBtn" class="btn primary">+ New job</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Status</th>
              <th>Attempts</th>
              <th>Created</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="jobsBody">
            <tr><td colspan="5" class="empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pagination">
        <button id="prevPageBtn" class="btn ghost">Prev</button>
        <span id="pageInfo"></span>
        <button id="nextPageBtn" class="btn ghost">Next</button>
      </div>
    </main>
  </section>

  <!-- New job modal -->
  <div id="newJobModal" class="modal-overlay" hidden>
    <div class="modal">
      <h2>New job</h2>
      <form id="newJobForm">
        <label>Name
          <input type="text" name="name" required placeholder="e.g. send-email" />
        </label>
        <label>Payload (JSON)
          <textarea name="payload" rows="5" placeholder="{}">{}</textarea>
        </label>
        <label>Max attempts
          <input type="number" name="maxAttempts" min="1" value="3" />
        </label>
        <div class="modal-actions">
          <button type="button" class="btn ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn primary">Create</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Job detail modal -->
  <div id="jobDetailModal" class="modal-overlay" hidden>
    <div class="modal">
      <h2>Job details</h2>
      <div id="jobDetailBody" class="job-detail"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-close-modal>Close</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
