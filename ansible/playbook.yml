---
- name: Install Docker and deploy the job-system stack
  hosts: job_system
  become: true

  vars:
    project_dir: "{{ playbook_dir | dirname }}"
    docker_arch_map:
      x86_64: amd64
      aarch64: arm64

  tasks:
    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker's official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker's official apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_arch_map[ansible_architecture] | default(ansible_architecture) }}
          signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker

    - name: Install Docker Engine and the Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Make sure Docker is running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Build and start the job-system stack
      ansible.builtin.command:
        cmd: ./scripts/setup.sh
        chdir: "{{ project_dir }}"
